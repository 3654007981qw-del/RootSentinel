name: build

# v2.22.45（审查 B P2-08）：仓库此前没有任何 CI。本工作流只做
# 单元测试 + debug 构建；release 构建按设计失败关闭（无签名凭据
# 即报错），签名凭据不进 CI，所以这里不跑 assembleRelease。
on:
  push:
  pull_request:

# v2.23.0（安全架构阶段三·供应链）：默认令牌权限收紧为只读，
# 第三方 Actions 全部 pin 到提交 SHA（不用可漂移的大版本标签）。
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'

      # 同 native job：setup-android@v3 在当前 runner 镜像上崩溃
      # （2026-11-15 实测，两个 job 同一步失败），改用 runner 自带
      # SDK + sdkmanager 直装本项目需要的 platform/build-tools。
      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "platforms;android-35" "build-tools;35.0.1"
          # API 37 平台用 runner 预装的 android-37.0（AGP 9.4 的
          # compileSdk release(37) + minorApiLevel 能直接识别带小
          # 版本号的平台目录，sdkmanager 里没有 platforms;android-37 这个包）。

      # gradle.properties 被 .gitignore 排除（2026-11-14 清理后定下的
      # 规矩：防签名密码误入该文件再被提交），所以 CI 里没有这个
      # 文件；构建必需的非机密属性用 -P 显式传入。
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest -Pandroid.useAndroidX=true -Pandroid.nonTransitiveRClass=false -Dorg.gradle.jvmargs=-Xmx3g

      - name: Assemble debug
        run: ./gradlew :app:assembleDebug -Pandroid.useAndroidX=true -Pandroid.nonTransitiveRClass=false -Dorg.gradle.jvmargs=-Xmx3g

  native:
    # v2.22.53（第八轮审查 P3-02）：此前 CI 只有上面的 Gradle job，
    # 用的是仓库内预编译 jniLibs——C++ 源码改坏、或 jniLibs 落后于
    # cpp/src，CI 都发现不了。本 job 用固定版本 NDK 真实编译三
    # ABI，并核对每个产物的 ELF 机器类型与 LOAD 对齐（64 位需
    # 16 KB 页对齐，arm32 为 4 KB）。签名指纹是已发布 APK 里可读
    # 的公开值，注入它只为让 I.APK_SIGNATURE 基线与本地构建一致。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'

      # 不用 android-actions/setup-android：v3 在当前 runner 镜像上
      # 于 sdkmanager 子进程环节崩溃（2026-11-15 本 job 首跑与既有
      # build job 同一步双双失败，属 action 基础设施问题）。runner
      # 镜像自带 Android SDK（$ANDROID_SDK_ROOT，含 sdkmanager），
      # 直接用它装固定版 NDK/CMake。
      - name: Install NDK + CMake
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Build native (3 ABIs)
        run: |
          NDK=$ANDROID_SDK_ROOT/ndk/27.2.12479018
          CMAKE=$ANDROID_SDK_ROOT/cmake/3.22.1/bin/cmake
          NINJA=$ANDROID_SDK_ROOT/cmake/3.22.1/bin/ninja
          for abi in arm64-v8a armeabi-v7a x86_64; do
            extra=""
            if [ "$abi" = "armeabi-v7a" ]; then extra="-DANDROID_ARM_MODE=arm"; fi
            $CMAKE -S app/src/main/cpp -B build-native/$abi \
              -DCMAKE_TOOLCHAIN_FILE=$NDK/build/cmake/android.toolchain.cmake \
              -DANDROID_ABI=$abi -DANDROID_PLATFORM=android-26 $extra \
              -DRS_SIGNER_SHA256=06377C87CB33D9AB1B0BAE330135AB67404AB96DEEA9F3584DDF2B2FFCDC7A06 \
              -DCMAKE_BUILD_TYPE=Release -DCMAKE_MAKE_PROGRAM=$NINJA -G Ninja
            $CMAKE --build build-native/$abi -j2
            test -s build-native/$abi/librootsentinel.so
          done

      - name: Verify ELF machine + LOAD alignment
        run: |
          check() {
            readelf -h build-native/$1/librootsentinel.so | grep -q "Machine:.*$2"
            align=$(readelf -lW build-native/$1/librootsentinel.so | awk '/LOAD/{print $NF; exit}')
            if [ "$align" != "$3" ]; then
              echo "$1 LOAD align $align != $3"; exit 1
            fi
          }
          check arm64-v8a AArch64 0x4000
          check armeabi-v7a ARM 0x1000
          check x86_64 X86-64 0x4000
